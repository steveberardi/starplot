name: Run Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - develop
  schedule:
        - cron: '0 12 * * *' # 1200 UTC = 0500 PT

jobs:
  test-lint-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: make install env
    - name: Download test fonts
      run: make download-test-fonts
    - name: Build sky.db
      run: make db setup CI=true
    - name: Check Lint
      run: make lint CI=true
    - name: Check Format
      run: make format CI=true ARGS=--check
    - name: Run Tests
      id: run-tests
      run: make test-python-version PYTHON_VERSION=${{ matrix.python-version }} CI=true
    - name: Run hash checks
      id: run-hash-checks
      run: make check-hashes-python-version PYTHON_VERSION=${{ matrix.python-version }} CI=true
    - name: Build examples
      if: always()
      run: make examples
    - name: Build tutorial
      if: always()
      run: make tutorial
    - name: Build docs
      if: always()
      run: make docs
    - name: Set Short SHA
      if: failure() && (steps.run-tests.outcome == 'failure' || steps.run-hash-checks.outcome == 'failure')
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
    - id: 'auth'
      if: failure() && (steps.run-tests.outcome == 'failure' || steps.run-hash-checks.outcome == 'failure')
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
    - name: 'Set up Google Cloud SDK'
      if: failure() && (steps.run-tests.outcome == 'failure' || steps.run-hash-checks.outcome == 'failure')
      uses: 'google-github-actions/setup-gcloud@v2'
      with:
        version: '>= 363.0.0'
    - name: 'Upload docs on failure'
      if: failure() && (steps.run-tests.outcome == 'failure' || steps.run-hash-checks.outcome == 'failure')
      run: 'gsutil -m rsync -R -d site gs://archives.starplot.dev/test-runs/$SHORT_SHA/${{ matrix.python-version }}/docs/'
    - name: 'Upload hash check results on failure'
      if: failure() && (steps.run-tests.outcome == 'failure' || steps.run-hash-checks.outcome == 'failure')
      run: |
        gsutil cp hash_checks/results.html gs://archives.starplot.dev/test-runs/$SHORT_SHA/${{ matrix.python-version }}/hash-checks/results.html
        gsutil -m rsync -r hash_checks/data gs://archives.starplot.dev/test-runs/$SHORT_SHA/${{ matrix.python-version }}/hash-checks/data/
    - name: 'Print results URLs'
      if: failure() && (steps.run-tests.outcome == 'failure' || steps.run-hash-checks.outcome == 'failure')
      run: |
        BASE="https://storage.googleapis.com/archives.starplot.dev/test-runs/$SHORT_SHA/${{ matrix.python-version }}"
        echo "docs: $BASE/docs/index.html"
        echo "hash checks: $BASE/hash-checks/results.html"
        echo "### Test run artifacts (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
        echo "- [docs]($BASE/docs/index.html)" >> "$GITHUB_STEP_SUMMARY"
        echo "- [hash checks]($BASE/hash-checks/results.html)" >> "$GITHUB_STEP_SUMMARY"
    - name: Build PIP Package
      run: make flit-build
