name: Run Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - develop
  schedule:
        - cron: '0 12 * * *' # 1200 UTC = 0500 PT

jobs:
  test-lint-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: make install env
    - name: Download test fonts
      run: make download-test-fonts
    - name: Build sky.db
      run: make db setup CI=true
    - name: Check Lint
      run: make lint CI=true
    - name: Check Format
      run: make format CI=true ARGS=--check
    - name: Run Tests
      id: run-tests
      run: make test e2e CI=true
    - name: Set Short SHA
      if: failure() && steps.run-tests.outcome == 'failure'
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
    - id: 'auth'
      if: failure() && steps.run-tests.outcome == 'failure'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
    - name: 'Set up Google Cloud SDK'
      if: failure() && steps.run-tests.outcome == 'failure'
      uses: 'google-github-actions/setup-gcloud@v2'
      with:
        version: '>= 363.0.0'
    - name: 'Upload e2e results on failure'
      if: failure() && steps.run-tests.outcome == 'failure'
      run: 'gsutil -m rsync -R -d e2e/actual gs://archives.starplot.dev/e2e-results/$SHORT_SHA/'
    - name: 'Print e2e results URL'
      if: failure() && steps.run-tests.outcome == 'failure'
      run: |
        URL="https://storage.googleapis.com/archives.starplot.dev/e2e-results/$SHORT_SHA/results.html"
        echo "e2e results: $URL"
        echo "### e2e results" >> "$GITHUB_STEP_SUMMARY"
        echo "[$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
    - name: Build PIP Package
      run: make flit-build

