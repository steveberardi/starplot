# Colorblind-friendly color scheme adapted from Bang Wong's research
# https://www.nature.com/articles/nmeth.1618
# via https://davidmathlogic.com/colorblind

axes:
  background:
    fill: '#fff'

horizon:
  line:
    stroke: hsl(0, 0%, 96%)
  label:
    fill: hsl(0, 0%, 0%)

zenith:
  marker:
    opacity: 1.0
    fill: hsl(26, 100%, 42%)
  label:
    fill: hsl(26, 100%, 42%)

title:
  fill: '#2f4358'
star:
  marker:
    stroke: '#fff'
celestial_equator:
  label:
    fill: hsl(202, 100%, 35%)
  line:
    stroke: hsl(202, 100%, 35%)

# Constellations
constellation_labels:
  fill: '#c5c5c5'
constellation_lines:
  opacity: 0.346
  stroke: hsl(202, 100%, 35%)
  width: 2

dso_double_star:
  marker:
    opacity: 0.6
dso_galaxy:
  label:
    fill: hsl(26, 100%, 32%)
  marker:
    opacity: 0.7
    fill: hsl(26, 100%, 42%)
    stroke: hsl(26, 100%, 32%)
dso_nebula:
  label:
    fill: hsl(163, 99%, 31%)
  marker:
    opacity: 0.7
    fill: hsl(163, 99%, 31%)
    stroke: hsl(163, 99%, 21%)
dso_planetary_nebula:
  label:
    fill: hsl(163, 99%, 31%)
  marker:
    opacity: 0.7
    fill: hsl(163, 99%, 31%)
    stroke: hsl(163, 99%, 21%)
dso_open_cluster:
  label:
    fill: hsl(56, 85%, 30%)
  marker:
    opacity: 0.8
    fill: hsl(56, 85%, 60%)
    stroke: hsl(56, 85%, 30%)
dso_globular_cluster:
  label:
    fill: hsl(56, 85%, 30%)
  marker:
    opacity: 0.8
    fill: hsl(56, 85%, 60%)
dso_association_stars:
  label:
    fill: hsl(56, 85%, 30%)
  marker:
    opacity: 0.8
    fill: hsl(56, 85%, 60%)
    stroke: hsl(56, 85%, 30%)


# other DSOs
dso_unknown: &DSO
  label:
    fill: hsl(163, 99%, 31%)
  marker:
    opacity: 0.7
    fill: hsl(163, 99%, 31%)
    stroke: hsl(163, 99%, 21%)
dso_dark_nebula: *DSO
dso_supernova_remnant: *DSO
dso_nova_star: *DSO
dso_nonexistant: *DSO
dso_unknown: *DSO
dso_duplicate: *DSO


ecliptic:
  label:
    fill: hsl(26, 100%, 42%)
  line:
    stroke: hsl(26, 100%, 42%)
milky_way:
  opacity: 0.18
  fill: hsl(202, 77%, 63%)
  stroke_width: 0
planets:
  marker:
    opacity: 0.6
    fill: hsl(42, 100%, 45%)

legend:
  background_color: '#fff'
