
axes:
  background:
    fill: '#4c566a'

text_border_color: '#4c566a'

border_bg_color: '#2e3440'
border_font_color: '#a3be8c'
border_line_color: '#a3be8c'

title:
  fill: '#a3be8c'

horizon:
  line:
    stroke: '#2e3440'
  label:
    fill: '#a3be8c'

zenith:
  marker:
    fill: '#D99CBA'
  label:
    fill: '#D99CBA'

celestial_equator:
  label:
    fill: '#77A67F'
    stroke: '#4c566a'
  line:
    stroke: '#77A67F'

ecliptic:
  label:
    fill: '#D99CBA'
    stroke: '#4c566a'
  line:
    stroke: '#D99CBA'

# Constellations
constellation_labels:
  opacity: 0.7
  fill: rgb(230, 204, 147)
constellation_lines:
  opacity: 0.36
  stroke: rgb(230, 204, 147)
constellation_borders:
  stroke: hsl(220, 16%, 12%)
  opacity: 0.8

dso_double_star:
  marker:
    opacity: 0.9
    fill: '#88c0d0'
    stroke: '#88c0d0'
  label:
    fill: '#88c0d0'
dso_galaxy:
  marker:
    opacity: 0.7
    fill: hsl(330, 45%, 74%)
    stroke: hsl(330, 45%, 63%)
  label:
    fill: hsl(330, 45%, 63%)
dso_nebula:
  marker:
    opacity: 0.7
    fill: hsl(172, 15%, 56%)
    stroke: hsl(172, 15%, 50%)
  label:
    fill: hsl(172, 15%, 56%)
dso_planetary_nebula:
  marker:
    opacity: 0.7
    fill: hsl(172, 15%, 56%)
    stroke: hsl(172, 15%, 50%)
  label:
    fill: hsl(172, 15%, 56%)

dso_open_cluster: &DSO-OC
  marker:
    opacity: 0.7
    fill: hsl(61, 45%, 73%)
    stroke: hsl(61, 45%, 5%)
  label:
    fill: '#9d9f3c'
dso_association_stars: *DSO-OC

dso_globular_cluster:
  marker:
    opacity: 0.7
    fill: '#c7c7c7'
    stroke: '#444'
  label:
    fill: '#444'


# other DSOs
dso_unknown: &DSO
  marker:
    opacity: 0.7
    fill: '#9CD9BB'
    stroke: '#52896e'
  label:
    fill: '#52896e'
dso_dark_nebula: *DSO
dso_supernova_remnant: *DSO
dso_nova_star: *DSO
dso_nonexistant: *DSO
dso_unknown: *DSO
dso_duplicate: *DSO

gridlines:
  label:
    opacity: 0.8
    fill: '#c2d2f3'
  line:
    opacity: 0.8
    stroke: '#888'
    style: solid

milky_way:
  opacity: 0.16
  fill: '#95a3bf'

planets:
  label:
    fill: '#D99CCF'
  marker:
    opacity: 0.8
    fill: '#D99CCF'

star:
  label:
    fill: '#88c0d0'
  marker:
    fill: '#88c0d0'
    stroke: '#4c566a'
sun:
  label:
    fill: '#88c0d0'
  marker:
    fill: '#88c0d0'
    stroke: '#88c0d0'
moon:
  label:
    fill: '#88c0d0'
  marker:
    fill: '#88c0d0'

bayer_labels:
  opacity: 0.9
  fill: '#85c9de'

legend:
  background_color: '#515e76'
  background_alpha: 1.0
  labels:
    fill: '#d5e0f5'
  title:
    fill: '#d5e0f5'
