
axes:
  background:
    fill: hsl(218, 88%, 99%)

text_border_color: hsl(218, 88%, 99%)

border_bg_color: '#b5cbe3'
border_font_color: '#2f4358'
border_line_color: '#2f4358'

horizon:
  line:
    stroke: '#b5cbe3'
  label:
    fill: '#2f4358'

zenith:
  marker:
    fill: hsl(18, 68%, 75%)
  label:
    fill: hsl(18, 68%, 75%)

title:
  fill: '#2f4358'
star:
  marker:
    stroke: '#fff'

celestial_equator:
  label:
    fill: '#2d5ec2'
    stroke: hsl(218, 88%, 99%)
  line:
    stroke: '#2d5ec2'

ecliptic:
  label:
    fill: '#e33b3b'
    stroke: hsl(218, 88%, 99%)
  line:
    stroke: hsl(359, 98%, 49%)

# Constellations
constellation_labels:
  opacity: 0.27
  fill: '#000'
constellation_lines:
  opacity: 0.52
  stroke: '#6ba832'
  width: 3

dso_double_star:
  marker:
    opacity: 1

dso_galaxy:
  marker:
    opacity: 1
    fill: hsl(330, 80%, 85%)
    stroke: hsl(330, 84%, 20%)
  label:
    fill: hsl(330, 84%, 20%)

dso_nebula: &DSO-NEB
  marker:
    opacity: 1
    fill: hsl(98, 68%, 82%)
    stroke: hsl(91, 63%, 24%)
  label:
    fill: hsl(91, 63%, 29%)
dso_planetary_nebula:
  marker:
    opacity: 1
    fill: hsl(96, 76%, 82%)
    stroke: hsl(91, 63%, 24%)
  label:
    fill: hsl(91, 63%, 29%)

dso_open_cluster: &DSO-OC
  marker:
    opacity: 1
    fill: hsl(58, 98%, 77%)
    stroke: "#000"
  label:
    fill: hsl(58, 98%, 20%)
dso_association_stars: *DSO-OC

dso_globular_cluster:
  marker:
    opacity: 1
    fill: hsl(58, 98%, 77%)
    stroke: "#000"
  label:
    fill: '#989400'

# other DSOs
dso_unknown: &DSO
  marker:
    opacity: 0.76
    fill: hsl(91, 53%, 75%)
    stroke: hsl(91, 53%, 40%)
  label:
    fill: hsl(91, 53%, 40%)
dso_dark_nebula: *DSO
dso_supernova_remnant: *DSO
dso_nova_star: *DSO
dso_nonexistant: *DSO
dso_unknown: *DSO
dso_duplicate: *DSO

milky_way:
  opacity: 0.25
  fill: hsl(203, 70%, 81%)
  stroke_width: 0
planets:
  marker:
    opacity: 0.4
    fill: '#f89d00'

legend:
  background_color: '#fff'
