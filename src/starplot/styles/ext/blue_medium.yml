# blue_medium

axes:
  background:
    fill: hsl(218, 88%, 97%)

figure:
  background:
    fill: hsl(212, 27%, 48%)

title:
  fill: '#f1f6ff'

star:
  marker:
    stroke: '#f1f6ff'
bayer_labels:
  opacity: 1
  fill: '#000'

# Constellations
constellation_labels:
  opacity: 1
  fill: hsl(212, 20%, 36%)
constellation_lines:
  opacity: 0.45
  stroke: hsl(91, 60%, 43%)

celestial_equator:
  label:
    fill: '#2d5ec2'
    stroke: hsl(218, 88%, 97%)
  line:
    stroke: hsl(220, 52%, 56%)
    opacity: 0.8

ecliptic:
  label:
    fill: hsl(207, 75%, 53%)
    stroke: hsl(218, 88%, 97%)
  line:
    stroke: hsl(207, 75%, 48%)
    opacity: 1

planets:
  marker:
    opacity: 1
    fill: hsl(37, 78%, 80%)
milky_way:
  fill: 'hsl(203, 60%, 84%)'
  stroke_width: 0
gridlines:
  label:
    opacity: 1
    fill: hsl(212, 27%, 93%)
  line:
    opacity: 0.6
    stroke: '#888'
    style: solid
sun:
  marker:
    fill: '#ffd22e'
    stroke: 'hsl(47, 100%, 29%)'

horizon:
  line:
    stroke: hsl(212, 38%, 68%)
  label:
    fill: hsl(212, 42%, 16%)

zenith:
  marker:
    fill: '#b979b7'
  label:
    fill: '#b979b7'

# DSOs

dso_galaxy:
  marker:
    opacity: 1
    fill: hsl(330, 90%, 82%)
    stroke: hsl(330, 84%, 20%)
  label:
    fill: hsl(330, 34%, 25%)

dso_nebula: &DSO-NEB
  marker:
    opacity: 1
    fill: hsl(98, 68%, 82%)
    stroke: hsl(91, 63%, 24%)
  label:
    fill: hsl(91, 63%, 29%)
dso_planetary_nebula:
  marker:
    opacity: 1
    fill: hsl(96, 76%, 82%)
    stroke: hsl(91, 63%, 24%)
  label:
    fill: hsl(91, 63%, 29%)

dso_open_cluster: &DSO-OC
  marker:
    opacity: 1
    fill: hsl(58, 98%, 77%)
    stroke: "#000"
  label:
    fill: hsl(58, 98%, 20%)
dso_association_stars: *DSO-OC

dso_globular_cluster:
  marker:
    opacity: 1
    fill: hsl(58, 98%, 77%)
    stroke: "#000"
  label:
    fill: '#989400'


# other DSOs
dso_unknown: &DSO
  marker:
    opacity: 1
    fill: hsl(91, 62%, 82%)
    stroke: hsl(91, 53%, 40%)
  label:
    fill: hsl(91, 53%, 40%)
dso_dark_nebula: *DSO
dso_supernova_remnant: *DSO
dso_nova_star: *DSO
dso_nonexistant: *DSO
dso_unknown: *DSO
dso_duplicate: *DSO

legend:
  background_color: '#f1f6ff'
  border_color: 'hsl(218, 27%, 48%)'
