
# Yellow Sat - hsl(49, 92%, 77%)
# Yellow unsat - hsl(48, 80%, 92%)
# blue - hsl(188, 35%, 76%)
# blue gray - hsl(225, 25%, 88%)
# green - hsl(71, 58%, 76%)
# red - hsl(26, 93%, 82%)

axes:
  background:
    fill: hsl(48, 80%, 96%)

figure:
  background:
    fill: hsl(60, 9%, 29%)

horizon:
  line:
    stroke: hsl(60, 3%, 32%)
  label:
    fill: hsl(60, 20%, 93%)

zenith:
  marker:
    fill: hsl(26, 93%, 82%)
  label:
    fill: hsl(26, 93%, 82%)

title:
  fill: hsl(60, 20%, 93%)

bayer_labels:
  opacity: 0.9
  fill: hsl(60, 3%, 17%)

flamsteed_labels:
  opacity: 0.9
  fill: hsl(60, 3%, 17%)

# Lines
celestial_equator:
  label:
    fill: hsl(188, 35%, 56%)
    stroke: hsl(48, 80%, 96%)
  line:
    stroke: hsl(188, 35%, 76%)
    opacity: 0.62

ecliptic:
  label:
    fill: hsl(26, 63%, 50%)
    stroke: hsl(48, 80%, 96%)
  line:
    stroke: hsl(26, 90%, 62%)
    opacity: 1

# Constellations
constellation_lines:
  opacity: 0.3
  stroke: hsl(48, 80%, 14%)
constellation_labels:
  font_weight: 200
  fill: hsl(60, 3%, 52%)
  opacity: 0.46
  font_name: "serif"
constellation_borders:
  stroke: hsl(37, 33%, 40%)
  opacity: 0.8
  zorder: -500

milky_way:
  opacity: 0.2
  fill: hsl(48, 40%, 75%)

gridlines:
  label:
    opacity: 0.8
    fill: hsl(60, 3%, 92%)
    font_size: 8
    font_weight: 200
  line:
    opacity: 0.6
    stroke: hsl(68, 11%, 71%)
    width: 1
star:
  marker:
    fill: hsl(60, 12%, 24%)
    stroke: hsl(48, 80%, 96%)
  label:
    fill: hsl(60, 3%, 24%)
planets:
  marker:
    symbol: circle
    opacity: 0.68
    fill: hsl(26, 93%, 82%)
    stroke: hsl(26, 93%, 52%)
  label:
    fill: hsl(60, 3%, 42%)
sun:
  label:
    fill: hsl(60, 3%, 42%)
  marker:
    fill: hsl(60, 12%, 32%)
    stroke: hsl(60, 12%, 32%)
moon:
  label:
    fill: hsl(60, 3%, 42%)
  marker:
    fill: hsl(48, 80%, 96%)
    stroke: hsl(60, 12%, 32%)

# DSOs
dso_double_star:
  marker:
    opacity: 0.9
dso_galaxy:
  marker:
    opacity: 1
    fill: hsl(26, 93%, 82%)
    stroke:  hsl(26, 93%, 32%)
  label:
    fill: hsl(26, 93%, 32%)
dso_nebula:
  marker:
    opacity: 1
    fill: hsl(71, 58%, 80%)
    stroke: hsl(71, 58%, 30%)
  label:
    fill: hsl(71, 58%, 30%)
dso_planetary_nebula:
  marker:
    opacity: 1
    fill: hsl(71, 58%, 80%)
    stroke: hsl(71, 58%, 30%)
  label:
    fill: hsl(71, 58%, 30%)

dso_open_cluster: &DSO-OC
  marker:
    opacity: 1
    fill: hsl(49, 96%, 76%)
    stroke: hsl(49, 92%, 17%)
  label:
    fill: hsl(49, 92%, 17%)
dso_association_stars: *DSO-OC

dso_globular_cluster:
  marker:
    opacity: 1
    fill: hsl(49, 96%, 76%)
    stroke: hsl(49, 92%, 17%)
  label:
    fill: hsl(49, 92%, 17%)

# other DSOs
dso_unknown: &DSO
  marker:
    opacity: 0.8
    fill: hsl(71, 58%, 76%)
    stroke: hsl(71, 58%, 36%)
  label:
    fill: hsl(71, 58%, 36%)
dso_dark_nebula: *DSO
dso_supernova_remnant: *DSO
dso_nova_star: *DSO
dso_nonexistant: *DSO
dso_unknown: *DSO
dso_duplicate: *DSO

legend:
  background_color: hsl(48, 50%, 98%)
  labels:
    fill: hsl(60, 3%, 24%)
  title:
    fill: hsl(60, 3%, 24%)
