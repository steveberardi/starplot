
axes:
  background:
    fill: hsl(209, 50%, 24%)

figure:
  background:
    fill: hsl(209, 43%, 15%)

title:
  fill: hsl(209, 56%, 86%)

bayer_labels:
  opacity: 0.8
  fill: hsl(209, 53%, 82%)

horizon:
  line:
    stroke: hsl(209, 60%, 13%)
  label:
    fill: hsl(209, 56%, 86%)

zenith:
  marker:
    fill: hsl(209, 20%, 75%)
  label:
    fill: hsl(209, 20%, 75%)

# Lines
celestial_equator:
  label:
    fill: hsl(209, 30%, 80%)
    stroke: hsl(209, 50%, 24%)
  line:
    stroke: hsl(209, 30%, 80%)

ecliptic:
  label:
    fill: '#e33b3b'
    stroke: hsl(209, 50%, 24%)
  line:
    stroke: '#e33b3b'
    opacity: 1

# Constellations
constellation_lines:
  opacity: 0.36
  stroke: hsl(209, 23%, 76%)
constellation_labels:
  opacity: 0.37
  fill: hsl(209, 23%, 80%)
constellation_borders:
  width: 2
  stroke: hsl(209, 50%, 74%)

dso_double_star:
  label:
    fill: hsl(209, 23%, 72%)
  marker:
    opacity: 0.8
    fill: '#88c0d0'
    stroke: '#88c0d0'


dso_galaxy:
  marker:
    opacity: 1
    fill: hsl(330, 70%, 66%)
    stroke: hsl(330, 54%, 30%)
  label:
    fill: hsl(330, 34%, 73%)

dso_nebula: &DSO-NEB
  marker:
    opacity: 1
    # color: hsl(98, 63%, 66%)
    fill: hsl(110, 52%, 62%)
    stroke: hsl(91, 53%, 10%)
  label:
    fill: hsl(91, 63%, 89%)
dso_planetary_nebula: *DSO-NEB

dso_open_cluster: &DSO-OC
  marker:
    opacity: 1
    fill: hsl(58, 64%, 50%)
    stroke: "#000"
  label:
    fill: hsl(58, 98%, 20%)
dso_association_stars: *DSO-OC

dso_globular_cluster:
  marker:
    opacity: 1
    fill: hsl(58, 64%, 50%)
    stroke: "#000"
  label:
    fill: hsl(209, 23%, 72%)


# other DSOs
dso_unknown: &DSO
  label:
    fill: hsl(209, 23%, 72%)
  marker:
    opacity: 0.46
    fill: hsl(209, 50%, 78%)
    stroke: hsl(209, 50%, 20%)
    zorder: -500
dso_dark_nebula: *DSO
dso_supernova_remnant: *DSO
dso_nova_star: *DSO
dso_nonexistant: *DSO
dso_unknown: *DSO
dso_duplicate: *DSO

gridlines:
  label:
    opacity: 1
    fill: hsl(209, 53%, 94%)
  line:
    opacity: 0.7
    stroke: hsl(209, 53%, 37%)
    width: 1
milky_way:
  opacity: 0.26
  fill: hsl(209, 50%, 54%)
  stroke_width: 0
planets:
  label:
    fill: hsl(209, 20%, 80%)
  marker:
    opacity: 0.8
    fill: hsl(209, 20%, 78%)
moon:
  label:
    fill: '#f2f2f2'
    opacity: 0.8
  marker:
    fill: '#e9e9e9'
star:
  label:
    fill: hsl(209, 23%, 84%)
  marker:
    fill: hsl(209, 50%, 94%)
    stroke: hsl(209, 50%, 24%)
sun:
  label:
    fill: hsl(209, 23%, 80%)
    font_size: 9
  marker:
    fill: hsl(209, 50%, 94%)
    stroke: hsl(209, 50%, 94%)

legend:
  background_color: hsl(209, 50%, 26%)
  background_alpha: 1.0
  labels:
    fill: hsl(209, 50%, 88%)
  title:
    fill: hsl(209, 50%, 88%)