
axes:
  background:
    fill: hsl(136, 0%, 10%)

figure:
  background:
    fill: hsl(136, 0%, 100%)

text_border_color: hsl(136, 0%, 10%)

border_bg_color: hsl(136, 0%, 20%)
border_font_color: hsl(136, 0%, 90%)
border_line_color: hsl(136, 0%, 54%)

horizon:
  line:
    stroke: hsl(136, 0%, 20%)
  label:
    fill: hsl(136, 0%, 90%)

zenith:
  marker:
    fill: hsl(136, 0%, 90%)
  label:
    fill: hsl(136, 0%, 90%)

title:
  fill: hsl(136, 0%, 0%)

star:
  label:
    fill: hsl(136, 0%, 78%)
  marker:
    fill: hsl(136, 0%, 92%)
    stroke: hsl(136, 0%, 10%)
sun:
  label:
    fill: hsl(136, 0%, 90%)
  marker:
    fill: hsl(136, 0%, 97%)
    stroke: hsl(136, 0%, 97%)
bayer_labels:
  fill: hsl(136, 0%, 80%)
flamsteed_labels:
  fill: hsl(136, 0%, 80%)
celestial_equator:
  label:
    fill: '#999'
  line:
    stroke: '#999'

# Constellations
constellation_labels:
  fill: hsl(136, 0%, 77%)
constellation_lines:
  stroke: hsl(136, 0%, 30%)
constellation_borders:
  stroke: hsl(136, 0%, 42%)
  opacity: 0.5

dso_double_star:
  label:
    fill: hsl(136, 0%, 97%)
  marker:
    fill: 'hsl(136, 0%, 97%)'
dso_galaxy:
  label:
    fill: hsl(136, 0%, 97%)
  marker:
    fill: 'hsl(136, 0%, 97%)'
    opacity: 0.8
    symbol: diamond
dso_nebula:
  label:
    fill: hsl(136, 0%, 97%)
  marker:
    fill: 'hsl(136, 0%, 97%)'
    opacity: 0.28
dso_planetary_nebula:
  label:
    fill: hsl(136, 0%, 97%)
  marker:
    fill: 'hsl(136, 0%, 97%)'
    opacity: 0.28
dso_open_cluster:
  label:
    fill: hsl(136, 0%, 97%)
  marker:
    stroke: 'hsl(136, 0%, 97%)'
    opacity: 0.8
dso_association_stars:
  label:
    fill: hsl(136, 0%, 97%)
  marker:
    stroke: 'hsl(136, 0%, 97%)'
    opacity: 0.8


# other DSOs
dso_unknown: &DSO
  label:
    fill: hsl(136, 0%, 97%)
  marker:
    fill: 'hsl(136, 0%, 97%)'
    opacity: 0.28
dso_dark_nebula: *DSO
dso_supernova_remnant: *DSO
dso_nova_star: *DSO
dso_nonexistant: *DSO
dso_unknown: *DSO
dso_duplicate: *DSO

ecliptic:
  label:
    fill: '#777'
  line:
    stroke: '#777'
milky_way:
  opacity: 0.1
  fill: hsl(136, 0%, 62%)
  stroke_width: 0
planets:
  label:
    fill: hsl(136, 0%, 97%)
  marker:
    fill: hsl(136, 0%, 97%)
    stroke: hsl(136, 0%, 97%)
moon:
  label:
    fill: hsl(136, 0%, 97%)
gridlines:
  label:
    fill: hsl(136, 0%, 0%)
legend:
  background_color: hsl(136, 0%, 64%)
