# blue_gold

axes:
  background:
    fill: rgb(46, 61, 74)

figure:
  background:
    fill: hsl(208, 23%, 13%)

title:
  fill: '#f1f6ff'

legend:
  background_color: 'rgb(46, 61, 74)'
  labels:
    fill: 'rgb(244, 233, 203)'
  title:
    fill: 'rgb(244, 233, 203)'

celestial_equator:
  label:
    fill: hsl(220, 76%, 54%)
    stroke: hsl(208, 23%, 12%)
  line:
    stroke: hsl(220, 72%, 52%)

ecliptic:
  label:
    fill: hsl(4, 78%, 54%)
    stroke: hsl(208, 23%, 12%)
  line:
    stroke: hsl(4, 78%, 52%)

horizon:
  line:
    stroke: hsl(208, 23%, 13%)
  label:
    fill: hsl(208, 23%, 84%)

gridlines:
  label:
    opacity: 1
    fill: hsl(208, 23%, 84%)
  line:
    opacity: 0.6
    stroke: '#888'
    style: solid

# Stars
star:
  marker:
    fill: rgb(244, 233, 203)
    stroke: rgb(46, 61, 74)
  label:
    fill: rgb(244, 233, 203)
bayer_labels:
  opacity: 1
  fill: rgb(244, 233, 203)
flamsteed_labels:
  fill: rgb(244, 233, 203)

# Constellations
constellation_labels:
  opacity: 0.75
  fill: rgb(244, 233, 203)
constellation_lines:
  opacity: 0.8
  stroke: rgb(34, 124, 130)
constellation_borders:
  stroke: hsl(208, 23%, 2%)

# Milky Way
milky_way:
  opacity: 0.14
  fill: '#94c5e3'
  stroke_width: 0

# Solar System
planets:
  label:
    fill: hsl(284, 78%, 90%)
  marker:
    opacity: 1
    fill: hsl(284, 80%, 80%)
sun:
  marker:
    fill: '#ffd22e'
    stroke: 'hsl(47, 100%, 29%)'

# DSOs
dso_galaxy:
  marker:
    opacity: 1
    fill: hsl(328, 30%, 56%)
    stroke: hsl(328, 63%, 24%)
  label:
    fill: hsl(328, 30%, 56%)

dso_nebula: &DSO-NEB
  marker:
    opacity: 1
    fill: hsl(118, 23%, 54%)
    stroke: hsl(118, 23%, 20%)
  label:
    fill: hsl(118, 23%, 54%)

dso_planetary_nebula:
  marker:
    opacity: 1
    fill: hsl(118, 23%, 54%)
    stroke: hsl(118, 43%, 70%)
  label:
    fill: hsl(118, 23%, 54%)

dso_open_cluster: &DSO-OC
  marker:
    opacity: 1
    fill: hsl(44, 70%, 64%)
    stroke: hsl(44, 98%, 63%)
    # rgb(46, 61, 74)
    stroke_width: 1
  label:
    fill: hsl(44, 70%, 64%)
dso_association_stars: *DSO-OC

dso_globular_cluster:
  marker:
    opacity: 1
    fill: hsl(44deg 70% 64%)
    stroke: rgb(46, 61, 74)
  label:
    fill: hsl(44, 70%, 64%)

dso_unknown: &DSO
  marker:
    opacity: 1
    fill: hsl(91, 62%, 82%)
    stroke: hsl(91, 53%, 40%)
  label:
    fill: hsl(91, 53%, 40%)
dso_dark_nebula: *DSO
dso_supernova_remnant: *DSO
dso_nova_star: *DSO
dso_nonexistant: *DSO
dso_unknown: *DSO
dso_duplicate: *DSO
