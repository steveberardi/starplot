
axes:
  background:
    fill: hsl(210, 29%, 15%)

figure:
  background:
    fill: hsl(210, 29%, 8%)

title:
  fill: hsl(210, 29%, 94%)

legend:
  background_color: hsl(210, 29%, 20%)
  background_alpha: 1.0
  border_color: hsl(210, 29%, 60%)
  labels:
    fill: hsl(210, 29%, 94%)
  title:
    fill: hsl(210, 29%, 94%)

gridlines:
  label:
    opacity: 1
    fill: hsl(209, 53%, 94%)
  line:
    opacity: 0.8
    stroke: hsl(210, 19%, 45%)
    style: solid
    width: 1

zenith:
  marker:
    fill: hsl(209, 20%, 75%)
  label:
    fill: hsl(209, 20%, 75%)

horizon:
  line:
    stroke: hsl(210, 36%, 11%)
  label:
    fill: hsl(210, 29%, 94%)

celestial_equator:
  label:
    fill: hsl(211, 47%, 81%)
    stroke: hsl(210, 29%, 15%)
  line:
    stroke: hsl(211, 47%, 61%)

galactic_equator:
  label:
    fill: hsl(211, 47%, 91%)
    stroke: hsl(210, 29%, 15%)
  line:
    stroke: hsl(211, 47%, 91%)

ecliptic:
  label:
    fill: hsl(1, 90%, 60%)
    stroke: hsl(210, 29%, 15%)
  line:
    stroke: hsl(1, 80%, 40%)
    opacity: 1

# Stars
star:
  label:
    fill: hsl(210, 29%, 94%)
  marker:
    fill: hsl(210, 29%, 98%)
    stroke: hsl(210, 29%, 15%)

bayer_labels:
  opacity: 0.9
  fill: hsl(210, 29%, 94%)
  font_size: 24

flamsteed_labels:
  opacity: 0.9
  fill: hsl(210, 29%, 94%)


# Constellations
constellation_lines:
  opacity: 0.64
  stroke: hsl(91, 60%, 70%)
constellation_labels:
  opacity: 1
  fill: hsl(210, 10%, 56%)
  stroke: hsl(210, 29%, 15%)
constellation_borders:
  width: 2
  stroke: hsl(209, 50%, 74%)

# Milky Way
milky_way:
  opacity: 0.4
  fill: hsl(210, 29%, 25%)
  stroke_width: 0

# DSOs
dso_double_star:
  label:
    fill: hsl(209, 23%, 72%)
  marker:
    opacity: 0.8
    fill: '#88c0d0'
    stroke: '#88c0d0'

dso_galaxy:
  marker:
    opacity: 1
    fill: hsl(323, 34%, 54%)
    stroke: hsl(321, 97%, 83%)
    stroke_width: 2
  label:
    fill: hsl(321, 95%, 80%)

dso_nebula: &DSO-NEB
  marker:
    opacity: 1
    fill: hsl(160, 15%, 44%)
    stroke: hsl(119, 100%, 95%)
  label:
    fill: hsl(119, 95%, 90%)
dso_planetary_nebula: *DSO-NEB

dso_open_cluster: &DSO-OC
  marker:
    opacity: 0.9
    fill: hsl(62, 72%, 43%)
    stroke: hsl(58, 100%, 68%)
    stroke_width: 1.75
  label:
    fill: hsl(58, 98%, 58%)
dso_association_stars: *DSO-OC

dso_globular_cluster:
  marker:
    opacity: 1
    fill: hsl(62, 29%, 14%)
    stroke: hsl(58, 98%, 72%)
  label:
    fill: hsl(58, 98%, 58%)

dso_unknown: &DSO
  label:
    fill: hsl(209, 23%, 72%)
  marker:
    opacity: 0.46
    fill: hsl(209, 50%, 78%)
    stroke: hsl(209, 50%, 20%)
    zorder: -500
dso_dark_nebula: *DSO
dso_supernova_remnant: *DSO
dso_nova_star: *DSO
dso_nonexistant: *DSO
dso_unknown: *DSO
dso_duplicate: *DSO

# Solar System
sun:
  label:
    fill: hsl(60, 92%, 71%)
    font_size: 9
  marker:
    fill: hsl(209, 50%, 90%)
    stroke: hsl(209, 50%, 94%)

moon:
  label:
    fill: '#f2f2f2'
    opacity: 0.8
  marker:
    fill: '#e9e9e9'

planets:
  label:
    fill: hsl(37, 80%, 76%)
  marker:
    opacity: 1
    fill: hsl(37, 80%, 56%)
